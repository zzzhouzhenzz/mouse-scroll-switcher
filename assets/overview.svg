<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How Mouse Scroll Switcher works</title>
  <desc id="desc">A mouse connection change triggers a fresh check of connected mice and the Natural scrolling setting. Matching states remain quiet and mismatches show a notification with Trackpad Settings and Not Now actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#263442" flood-opacity=".12"/>
    </filter>
    <style>
      .ink{fill:#1f2933}.muted{fill:#697682}.blue{fill:#1479e8}.card{fill:#fff;stroke:#dce4eb;stroke-width:2}.line{fill:none;stroke:#9aa8b5;stroke-width:4;stroke-linecap:round}.label{font:600 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{font:500 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.tiny{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font:700 48px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    </style>
  </defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <text x="92" y="100" class="title ink">One fresh check. No scroll interception.</text>
  <text x="94" y="140" class="small muted">On launch, connect, and disconnect</text>

  <g filter="url(#shadow)">
    <rect x="90" y="205" width="310" height="350" rx="32" class="card"/>
    <rect x="645" y="205" width="310" height="350" rx="32" class="card"/>
    <rect x="1200" y="205" width="310" height="350" rx="32" class="card"/>
  </g>

  <g transform="translate(198 260) scale(.72)">
    <path d="M65 0c-58 0-95 43-95 113v32c0 70 37 113 95 113s95-43 95-113v-32C160 43 123 0 65 0Z" fill="#263442"/>
    <path d="M65 0v82" stroke="#fbfaf7" stroke-width="5"/>
    <rect x="53" y="30" width="24" height="48" rx="12" fill="#1481ee"/>
  </g>
  <circle cx="340" cy="262" r="12" fill="#29a36a"/>
  <text x="245" y="476" text-anchor="middle" class="label ink">Mouse state changed</text>
  <text x="245" y="510" text-anchor="middle" class="small muted">Public IOHIDManager callback</text>

  <path d="M410 380h185" class="line"/>
  <path d="m582 365 18 15-18 15" class="line"/>
  <rect x="466" y="349" width="78" height="31" rx="15" fill="#e4f1ff"/>
  <text x="505" y="371" text-anchor="middle" class="tiny blue">trigger</text>

  <g transform="translate(710 257)">
    <circle cx="90" cy="92" r="88" fill="#e4f1ff"/>
    <path d="M48 90h27l18 19 40-51" fill="none" stroke="#1479e8" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="800" y="441" text-anchor="middle" class="label ink">Read current truth</text>
  <text x="800" y="478" text-anchor="middle" class="small muted">Connected mouse list</text>
  <text x="800" y="510" text-anchor="middle" class="small muted">Natural scrolling setting</text>

  <path d="M965 380h185" class="line"/>
  <path d="m1137 365 18 15-18 15" class="line"/>
  <rect x="1013" y="349" width="90" height="31" rx="15" fill="#e4f1ff"/>
  <text x="1058" y="371" text-anchor="middle" class="tiny blue">compare</text>

  <g transform="translate(1250 254)">
    <rect width="210" height="150" rx="25" fill="#f2f4f6" stroke="#d9e0e6" stroke-width="2"/>
    <circle cx="34" cy="34" r="18" fill="#1479e8"/>
    <path d="M29 34h10M34 29v10" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <rect x="62" y="22" width="111" height="13" rx="6" fill="#263442"/>
    <rect x="62" y="47" width="126" height="10" rx="5" fill="#9aa8b5"/>
    <rect x="20" y="90" width="108" height="37" rx="12" fill="#1479e8"/>
    <rect x="137" y="90" width="53" height="37" rx="12" fill="#e1e5e9"/>
  </g>
  <text x="1355" y="441" text-anchor="middle" class="label ink">Mismatch? Notify.</text>
  <text x="1355" y="478" text-anchor="middle" class="small muted">Open Trackpad Settings</text>
  <text x="1355" y="510" text-anchor="middle" class="small muted">or Not Now</text>

  <g transform="translate(90 635)">
    <rect width="1420" height="170" rx="28" fill="#25313d"/>
    <text x="38" y="48" class="label" fill="#fff">Decision table</text>
    <g transform="translate(38 75)">
      <circle cx="11" cy="11" r="11" fill="#29a36a"/><text x="33" y="18" class="small" fill="#fff">Mouse present + Natural off</text>
      <circle cx="370" cy="11" r="11" fill="#1479e8"/><text x="392" y="18" class="small" fill="#fff">Mouse present + Natural on</text>
      <circle cx="740" cy="11" r="11" fill="#29a36a"/><text x="762" y="18" class="small" fill="#fff">No mouse + Natural on</text>
      <circle cx="1060" cy="11" r="11" fill="#1479e8"/><text x="1082" y="18" class="small" fill="#fff">No mouse + Natural off</text>
      <text x="33" y="55" class="tiny" fill="#b7c2cc">quiet</text>
      <text x="392" y="55" class="tiny" fill="#b7c2cc">notify</text>
      <text x="762" y="55" class="tiny" fill="#b7c2cc">quiet</text>
      <text x="1082" y="55" class="tiny" fill="#b7c2cc">notify</text>
    </g>
  </g>
</svg>
